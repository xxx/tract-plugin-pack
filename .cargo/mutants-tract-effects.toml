# Runtime and editor mappings; the rest of the editor rollout is in progress.
examine_re = [
    '^tract-effects/src/(compressor|modulation|randomize|undo)\.rs:',
    '^tract-effects/src/effects/',
    '^tract-effects/src/editor/view\.rs:\d+:\d+: replace (segment_to_slot|slot_to_segment|kind_items|target_items|target_from_item|target_to_item|trigger_items|trigger_from_item|trigger_to_item|beats_norm_to_value|beats_value_to_norm|format_beats_label) ->',
    '^tract-effects/src/editor/view\.rs:\d+:\d+: .* in (segment_to_slot|slot_to_segment|kind_items|target_items|target_from_item|target_to_item|trigger_items|trigger_from_item|trigger_to_item|beats_norm_to_value|beats_value_to_norm|format_beats_label)$',
]
all_features = true
test_tool = "nextest"
profile = "mutants"
additional_cargo_args = ["--locked"]
additional_cargo_test_args = ["--profile=mutants"]
gitignore = true

exclude_re = [
    # None and invalid targets share the zero fallback.
    '^tract-effects/src/editor/view\.rs:\d+:9: delete match arm None in target_to_item$',
    # Clamping and rounding already restrict the index to 0..10.
    '^tract-effects/src/editor/view\.rs:\d+:43: replace - with (\+|/) in beats_norm_to_value$',
    # An empty Vec allocates nothing and leaks the same empty-slice value.
    "^tract-effects/src/effects/none\\.rs:\\d+:9: replace <impl Effect for NoneEffect>::parameters -> &'static\\[ParamSpec\\] with Vec::leak\\(Vec::new\\(\\)\\)$",
    # Negative float-to-index casts saturate to zero; zero also selects index zero.
    '^tract-effects/src/effects/mod\.rs:\d+:16: replace < with (==|<=) in enum_index$',
    # At equal peak/envelope, the attack/release choice multiplies a zero delta.
    'replace > with >= in Compressor::process_sample$',
    '^tract-effects/src/modulation\.rs:\d+:35: replace > with >= in TransientDetector::process_sample$',
    # Public Compressor paths use fixed positive times and sample_rate >= 1.
    'replace > with >= in time_to_coef$',
    # At +/-0 BPM, division gives infinity/NaN; the finite-length guard freezes.
    '^tract-effects/src/modulation\.rs:\d+:31: replace > with >= in mseg_phase_delta$',
    # At valid audio rates, zero Hz adds zero to a phase already below 1.
    '^tract-effects/src/modulation\.rs:\d+:48: replace > with >= in ModulationState::begin_block$',
    # norm < 1 and registered enum sizes make floor(norm*n) <= n-1;
    # loosening the defensive upper cap cannot change the selected index.
    '^tract-effects/src/randomize\.rs:\d+:42: replace - with (\+|/) in randomize_track_effect$',
    # Equal peaks preserve the gate detector exactly with the delta update.
    '^tract-effects/src/effects/gate\.rs:\d+:17: replace > with >= in <impl Effect for GateEffect>::process_sample$',
    # At gain 0 or 1, either smoothing coefficient preserves the same endpoint.
    '^tract-effects/src/effects/gate\.rs:\d+:31: replace > with >= in <impl Effect for GateEffect>::process_sample$',
    # At the lower knee boundary, both branches give unity audio gain.
    '^tract-effects/src/effects/limiter\.rs:\d+:25: replace < with <= in LimiterEffect::gain_computer_db$',
    # Equal peaks only change fast-follower rounding; slow attack/release are equal.
    '^tract-effects/src/effects/transient_shaper\.rs:\d+:29: replace > with >= in TransientShaperEffect::follower_step$',
    # The fallback applies the same hard clip as the explicit Hard arm.
    '^tract-effects/src/effects/distortion\.rs:\d+:13: delete match arm Self::TYPE_HARD in DistortionEffect::shape$',
    # At the fold boundary, both branches return exactly 1.
    '^tract-effects/src/effects/distortion\.rs:\d+:25: replace < with <= in DistortionEffect::shape$',
    # The setter already bounds stored types to 0..4 before this defensive cap.
    '^tract-effects/src/effects/distortion\.rs:\d+:85: replace - with (\+|/) in <impl Effect for DistortionEffect>::process_sample$',
    # At either threshold, the outer integral subtracts the identical bp() value.
    '^tract-effects/src/effects/wavefolder\.rs:\d+:20: replace > with >= in FolderCell::func_ad1$',
    # The outer region has signum +/-1, so multiplication and division agree.
    '^tract-effects/src/effects/wavefolder\.rs:\d+:33: replace \* with / in FolderCell::func$',
    # At a triangle window's midpoint, both branches return exactly 1.
    '^tract-effects/src/effects/(pitch_shift|varispeed)\.rs:\d+:18: replace < with <= in (PitchShiftEffect|VarispeedEffect)::triangle_window$',
    # The Comb setter already bounds modes to 0..2 before this defensive cap.
    '^tract-effects/src/effects/comb\.rs:\d+:81: replace - with (\+|/) in <impl Effect for CombEffect>::process_sample$',
    # Higher Type selectors still choose HP; higher Poles selectors still use four stages.
    '^tract-effects/src/effects/svf\.rs:\d+:(54|55): replace - with (\+|/) in <impl Effect for SvfEffect>::set_param$',
    # Type selectors above 1 still choose the HP coefficient and processing branches.
    '^tract-effects/src/effects/sallen_key\.rs:\d+:\d+: replace - with (\+|/) in <impl Effect for SallenKeyEffect>::set_param$',
    # Triangle arms agree exactly at 1/4 and 3/4; keep Square's boundary active.
    '^tract-effects/src/effects/auto_pan\.rs:(79:22|81:29): replace < with <= in AutoPanEffect::eval_lfo$',
    '^tract-effects/src/effects/tremolo\.rs:(82:22|84:29): replace < with <= in TremoloEffect::eval_lfo$',
    # Higher Shape selectors still choose Saw in both LFOs.
    '^tract-effects/src/effects/(auto_pan|tremolo)\.rs:\d+:59: replace - with (\+|/) in <impl Effect for (AutoPanEffect|TremoloEffect)>::set_param$',
    # The Ring setter bounds stored shapes to 0..1 before this defensive cap.
    '^tract-effects/src/effects/ring\.rs:\d+:84: replace - with (\+|/) in <impl Effect for RingEffect>::process_sample$',
    # Triangle arms agree exactly at 1/4 and 3/4 of a cycle.
    '^tract-effects/src/effects/flanger\.rs:\d+:(14|21): replace < with <= in FlangerEffect::triangle_lfo$',
    # Triangle arms agree at 1/4 and 3/4; keep Square's half-cycle boundary active.
    '^tract-effects/src/effects/vibrato\.rs:(97:22|99:29): replace < with <= in VibratoEffect::eval_lfo$',
    # Higher Shape selectors still choose the Saw fallback.
    '^tract-effects/src/effects/vibrato\.rs:\d+:59: replace - with (\+|/) in <impl Effect for VibratoEffect>::set_param$',
    # Mode and Topology are stored as 0 or 1, so neither can equal 0.5.
    '^tract-effects/src/effects/fm\.rs:\d+:(22|46|51): replace < with <= in <impl Effect for FmEffect>::process_sample$',
    # Equal target/envelope values make either smoothing coefficient multiply zero.
    '^tract-effects/src/effects/fm\.rs:\d+:42: replace > with >= in <impl Effect for FmEffect>::process_sample$',
    # Equal target/envelope values make either duck coefficient multiply zero.
    '^tract-effects/src/effects/delay\.rs:\d+:34: replace > with >= in <impl Effect for DelayEffect>::process_sample$',
    # Higher Time indices still select Free and leave its dial active.
    '^tract-effects/src/effects/delay\.rs:\d+:56: replace - with (\+|/) in <impl Effect for DelayEffect>::set_param$',
    # Construction/reset pair unprimed with zero length; priming captures at least 16 samples.
    '^tract-effects/src/effects/repeat\.rs:\d+:25: replace \|\| with && in <impl Effect for RepeatEffect>::process_sample$',
    # With zero crossfade, the playhead cannot reach the loop end in this branch.
    '^tract-effects/src/effects/repeat\.rs:\d+:43: replace > with >= in <impl Effect for RepeatEffect>::process_sample$',
    # Smooth already limits the fade to half a bounded loop, so a larger cap is redundant.
    '^tract-effects/src/effects/repeat\.rs:\d+:56: replace / with \* in <impl Effect for RepeatEffect>::process_sample$',
    # Priming always installs a window of at least 16 samples; reset clears both.
    '^tract-effects/src/effects/stretch\.rs:\d+:25: replace \|\| with && in <impl Effect for StretchEffect>::process_sample$',
    # Equal signal/envelope values make either coefficient multiply a zero delta.
    '^tract-effects/src/effects/vocoder\.rs:\d+:23: replace > with >= in VocoderEffect::step_env$',
    # The Carrier setter stores 0..2 before this defensive upper cap.
    '^tract-effects/src/effects/vocoder\.rs:\d+:87: replace - with (\+|/) in VocoderEffect::next_carrier$',
    # Clamped f32 scale differences lie on a 2^-24 grid; 1e-6 is off that grid.
    '^tract-effects/src/effects/spectral_shift\.rs:\d+:44: replace < with <= in <impl SpectralTransform for TransformCtx>::transform$',
    # Active transforms overwrite all used magnitudes; bypass never reads scratch.
    '^tract-effects/src/effects/spectral_spread\.rs:\d+:9: replace SpectralSpreadChannel::reset with \(\)$',
    # Extra backing entries are unused; supported FFTs access at most 2049 values.
    '^tract-effects/src/effects/spectral_smear\.rs:16:39: replace / with \*$',
    # Extra backing entries are unused by the supported FFT sizes.
    '^tract-effects/src/effects/spectral_corrupt\.rs:17:39: replace / with \*$',
    # Zero Amount returns through the deadband before choosing quiet/loud ranks.
    "^tract-effects/src/effects/spectral_corrupt\\.rs:\\d+:33: replace > with >= in <impl SpectralTransform for TransformCtx<'_>>::transform$",
    # Extra mask entries are unused by the supported FFT sizes.
    '^tract-effects/src/effects/spectral_lofi\.rs:14:39: replace / with \*$',
    # A larger backing stride only adds unused entries between supported bins.
    '^tract-effects/src/effects/spectral_scatter\.rs:21:39: replace / with \*$',
    # A larger backing stride only adds unused entries between supported bins.
    '^tract-effects/src/effects/spectral_cascade\.rs:23:39: replace / with \*$',
    # Extra tail entries are unused by the supported FFT sizes.
    '^tract-effects/src/effects/spectral_reverb\.rs:13:39: replace / with \*$',
    # Stored sample rate is unused; FFT and dry delay run at fixed sample counts.
    '^tract-effects/src/effects/satch\.rs:\d+:9: replace <impl Effect for SatchEffect>::set_sample_rate with \(\)$',
    # The shifter bounds bins again, so expanding this outer cap leaves audio unchanged.
    '^tract-effects/src/effects/warp_zone\.rs:\d+:44: replace / with \* in WarpZoneEffect::frequency_bins$',
]
