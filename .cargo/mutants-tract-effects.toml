# Shared runtime and registered effect families; expand remaining families separately.
examine_re = [
    '^tract-effects/src/(compressor|modulation|randomize|undo)\.rs:',
    '^tract-effects/src/effects/(compressor|limiter|gate|transient_shaper)\.rs:',
    '^tract-effects/src/effects/(bitcrush|distortion|downsample|wavefolder)\.rs:',
    '^tract-effects/src/effects/(haas|stereo_widener)\.rs:',
    '^tract-effects/src/effects/(frequency_shift|pitch_shift|varispeed)\.rs:',
]
all_features = true
test_tool = "nextest"
profile = "mutants"
additional_cargo_args = ["--locked"]
additional_cargo_test_args = ["--profile=mutants"]
gitignore = true

exclude_re = [
    # At equal peak/envelope, the attack/release choice multiplies a zero delta.
    'replace > with >= in Compressor::process_sample$',
    '^tract-effects/src/modulation\.rs:\d+:35: replace > with >= in TransientDetector::process_sample$',
    # Public Compressor paths use fixed positive times and sample_rate >= 1.
    'replace > with >= in time_to_coef$',
    # At +/-0 BPM, division gives infinity/NaN; the finite-length guard freezes.
    '^tract-effects/src/modulation\.rs:\d+:31: replace > with >= in mseg_phase_delta$',
    # At valid audio rates, zero Hz adds zero to a phase already below 1.
    '^tract-effects/src/modulation\.rs:\d+:48: replace > with >= in ModulationState::begin_block$',
    # norm < 1 and registered enum sizes make floor(norm*n) <= n-1;
    # loosening the defensive upper cap cannot change the selected index.
    '^tract-effects/src/randomize\.rs:\d+:42: replace - with (\+|/) in randomize_track_effect$',
    # Equal peaks preserve the gate detector exactly with the delta update.
    '^tract-effects/src/effects/gate\.rs:\d+:17: replace > with >= in <impl Effect for GateEffect>::process_sample$',
    # At gain 0 or 1, either smoothing coefficient preserves the same endpoint.
    '^tract-effects/src/effects/gate\.rs:\d+:31: replace > with >= in <impl Effect for GateEffect>::process_sample$',
    # At the lower knee boundary, both branches give unity audio gain.
    '^tract-effects/src/effects/limiter\.rs:\d+:25: replace < with <= in LimiterEffect::gain_computer_db$',
    # Equal peaks only change fast-follower rounding; slow attack/release are equal.
    '^tract-effects/src/effects/transient_shaper\.rs:\d+:29: replace > with >= in TransientShaperEffect::follower_step$',
    # The fallback applies the same hard clip as the explicit Hard arm.
    '^tract-effects/src/effects/distortion\.rs:\d+:13: delete match arm Self::TYPE_HARD in DistortionEffect::shape$',
    # At the fold boundary, both branches return exactly 1.
    '^tract-effects/src/effects/distortion\.rs:\d+:25: replace < with <= in DistortionEffect::shape$',
    # The setter already bounds stored types to 0..4 before this defensive cap.
    '^tract-effects/src/effects/distortion\.rs:\d+:85: replace - with (\+|/) in <impl Effect for DistortionEffect>::process_sample$',
    # At either threshold, the outer integral subtracts the identical bp() value.
    '^tract-effects/src/effects/wavefolder\.rs:\d+:20: replace > with >= in FolderCell::func_ad1$',
    # The outer region has signum +/-1, so multiplication and division agree.
    '^tract-effects/src/effects/wavefolder\.rs:\d+:33: replace \* with / in FolderCell::func$',
    # At a triangle window's midpoint, both branches return exactly 1.
    '^tract-effects/src/effects/(pitch_shift|varispeed)\.rs:\d+:18: replace < with <= in (PitchShiftEffect|VarispeedEffect)::triangle_window$',
]
