# All tract-effects library modules and features.
all_features = true
test_tool = "nextest"
profile = "mutants"
additional_cargo_args = ["--locked"]
additional_cargo_test_args = ["--profile=mutants"]
gitignore = true

exclude_re = [
    # Packed RGBA byte fields do not overlap, so XOR and OR agree.
    '^tract-effects/src/editor/mod\.rs:\d+:(40|52|63): replace \| with \^ in Session<[^>]+>::draw_effect_view$',
    # A zero-width divider paints no pixels.
    '^tract-effects/src/editor/view\.rs:\d+:15: replace > with >= in draw_section_header$',
    # None and invalid targets share the zero fallback.
    '^tract-effects/src/editor/view\.rs:\d+:9: delete match arm None in target_to_item$',
    # Clamping and rounding already restrict the index to 0..10.
    '^tract-effects/src/editor/view\.rs:\d+:43: replace - with (\+|/) in beats_norm_to_value$',
    # An empty Vec allocates nothing and leaks the same empty-slice value.
    "^tract-effects/src/effects/none\\.rs:\\d+:9: replace <impl Effect for NoneEffect>::parameters -> &'static\\[ParamSpec\\] with Vec::leak\\(Vec::new\\(\\)\\)$",
    # Negative float-to-index casts saturate to zero; zero also selects index zero.
    '^tract-effects/src/effects/mod\.rs:\d+:16: replace < with (==|<=) in enum_index$',
    # At equal peak/envelope, the attack/release choice multiplies a zero delta.
    'replace > with >= in Compressor::process_sample$',
    '^tract-effects/src/modulation\.rs:\d+:35: replace > with >= in TransientDetector::process_sample$',
    # Public Compressor paths use fixed positive times and sample_rate >= 1.
    'replace > with >= in time_to_coef$',
    # At +/-0 BPM, division gives infinity/NaN; the finite-length guard freezes.
    '^tract-effects/src/modulation\.rs:\d+:31: replace > with >= in mseg_phase_delta$',
    '^tract-effects/src/modulation/smoothing\.rs:\d+:31: replace > with >= in phase_step$',
    # Each slot contributes a different bit to the smoothing mask.
    '^tract-effects/src/modulation/smoothing\.rs:\d+:18: replace \| with \^ in TrackModulation::smoothing_mask$',
    # Until the loop end (at most 1), the default one-shot cap preserves next.
    '^tract-effects/src/modulation/smoothing\.rs:\d+:9: delete match arm \(PlayMode::OneShot, HoldMode::Loop\{\.\.\}\) in phase_next$',
    # The float has 32 bits, below the presence bit.
    '^tract-effects/src/modulation/audition\.rs:\d+:47: replace \| with \^ in AuditionControl::store_settings$',
    # The epoch, valid bit, row, effect kind, and source occupy disjoint bits.
    '^tract-effects/src/modulation/audition\.rs:(138|139|140|141):13: replace \| with \^ in AuditionControl::begin$',
    # A writer clears the low bit first. Readers reject both odd and zero stamps.
    '^tract-effects/src/modulation/audition\.rs:\d+:32: replace \| with (\^|&) in AuditionControl::(begin|update)$',
    '^tract-effects/src/modulation_telemetry\.rs:\d+:32: replace \| with (\^|&) in AtomicFrame::store$',
    # A present filter is clamped to 20..20000 Hz, with nonzero float bits. Level is absent.
    '^tract-effects/src/modulation/audition\.rs:\d+:19: replace >> with << in AuditionControl::snapshot$',
    # Packed floats occupy the low word and tags or the second float occupy the high word.
    '^tract-effects/src/modulation_telemetry\.rs:\d+:(24|28|52): replace \| with \^ in (pair|norm|optional_float)$',
    # Valid wave fields occupy separate bytes. Invalid envelope 255 decodes as absent either way.
    '^tract-effects/src/modulation_telemetry\.rs:(108|109|110):13: replace \| with \^ in wave_tag$',
    # is_valid already rejects envelope and channel overflow after decoding.
    '^tract-effects/src/modulation_telemetry\.rs:\d+:38: replace \|\| with && in read_wave_tag$',
    # The request key and epoch occupy disjoint bits, as do the packed key fields.
    '^tract-effects/src/modulation_telemetry\.rs:(353|354|355|356|357|358|359):13: replace \| with \^ in ModulationTelemetry::request_for_modes$',
    '^tract-effects/src/modulation_telemetry\.rs:\d+:44: replace \| with \^ in ModulationTelemetry::request_for_modes$',
    # The waveform request fields and stereo range samples occupy disjoint bits.
    '^tract-effects/src/waveform\.rs:(67|68|69|70):13: replace \| with \^ in WaveformTelemetry::request_source$',
    '^tract-effects/src/waveform\.rs:\d+:44: replace \| with \^ in (WaveformTelemetry::request_source|WaveformTelemetry::record_stereo)$',
    # Detector key modifiers use distinct flag bits.
    "^tract-effects/src/editor/detector\\.rs:(671:64|685:(56|74)): replace \\| with \\^ in Session<'_>::handle_detector_event$",
    # At zero detector level, both -80 dB and -infinity produce a zero-width bar.
    '^tract-effects/src/editor/detector\.rs:\d+:33: replace > with >= in EffectEditor::draw_detector$',
    # Callers provide nonnegative widths and measuring empty text returns zero.
    '^tract-effects/src/editor/follower\.rs:\d+:15: replace > with >= in bounded_text$',
    # DropdownState::open clamps the selection to the last row independently.
    "^tract-effects/src/editor/midi\\.rs:\\d+:35: replace - with (\\+|/) in Session<'_>::open_midi_filter$",
    # Timing and Waves key modifiers use distinct flag bits.
    "^tract-effects/src/editor/timing\\.rs:507:(52|70): replace \\| with \\^ in Session<'_>::handle_timing_event$",
    "^tract-effects/src/editor/wave_midi\\.rs:524:(52|70): replace \\| with \\^ in Session<'_>::handle_wave_midi_event$",
    # The directional factor is always +1 or -1.
    "^tract-effects/src/editor/timing\\.rs:575:27: replace \\* with / in Session<'_>::handle_timing_event$",
    # Complementing the sidechain flag in every cached key preserves key equality.
    '^tract-effects/src/editor/live\.rs:\d+:37: replace == with != in LiveSource::refresh_waveform$',
    # The f32 projection still requires a positive rate.
    '^tract-effects/src/modulation/precise\.rs:62:19: replace > with >= in PreciseTrigger::prepare$',
    # Before the first valid sample rate, refractory is zero and NaN casts to zero.
    '^tract-effects/src/modulation/precise\.rs:83:33: replace > with >= in PreciseTrigger::prepare$',
    # Modifiers occupy distinct bits and the key direction is always +1 or -1.
    "^tract-effects/src/editor/follower/events\\.rs:326:(52|70): replace \\| with \\^ in Session<'_>::handle_follower_event$",
    "^tract-effects/src/editor/follower/events\\.rs:435:31: replace \\* with / in Session<'_>::handle_follower_event$",
    # Callers pass valid row indices. focus_follower also clamps End and PageDown to the last row.
    "^tract-effects/src/editor/follower/events\\.rs:117:50: replace - with (\\+|/) in Session<'_>::focus_follower$",
    "^tract-effects/src/editor/follower/events\\.rs:(406:58|412:81): replace - with (\\+|/) in Session<'_>::handle_follower_event$",
    # Both follower lists disable filtering, so Backspace leaves their selections unchanged.
    "^tract-effects/src/editor/follower/events\\.rs:340:25: delete match arm Key::Backspace in Session<'_>::handle_follower_event$",
    # Level zero formats as -inf dB through either branch.
    '^tract-effects/src/editor/follower/view\.rs:\d+:34: replace > with >= in EffectEditor::draw_follower_popup$',
    # Each route contributes a distinct bit. Mode uses bits 0 and 1, and sidechain uses bit 2.
    '^tract-effects/src/modulation/follower\.rs:\d+:(22|14): replace \| with \^ in FollowerConfig::(mask|request_key)$',
    # The route comparison above already marks every changed enable bit.
    '^tract-effects/src/modulation/follower\.rs:\d+:33: replace \| with & in FollowerRuntime::prepare$',
    # The f32 validation still rejects nonfinite and nonpositive rates.
    '^tract-effects/src/modulation/(follower|trigger_timing)\.rs:\d+:28: replace \|\| with && in (FollowerRuntime|TimingRuntime)::prepare$',
    # At zero rate the division is nonfinite, and the step falls back to zero.
    '^tract-effects/src/modulation/pitch\.rs:\d+:73: replace > with >= in MidiPitchRuntime::update_rate$',
    # Before the first valid rate, audio is inactive and no blends have been armed.
    '^tract-effects/src/modulation/trigger_timing\.rs:(163:36|181:29): replace > with >= in TimingRuntime::prepare$',
    # Before the first valid rate, reset has already cleared the follower hold count.
    '^tract-effects/src/modulation/follower\.rs:\d+:29: replace > with >= in FollowerRuntime::prepare$',
    # Active routes have a positive stored rate and recalculate the identical gain.
    '^tract-effects/src/modulation/follower\.rs:\d+:87: replace == with != in FollowerRuntime::prepare$',
    # Each clock domain contributes one distinct bit.
    '^tract-effects/src/modulation/position\.rs:\d+:22: replace \| with \^ in PositionClock::jump_mask$',
    # Float range, enable, and mode use disjoint bit fields.
    '^tract-effects/src/modulation_telemetry/follower\.rs:\d+:(57|80): replace \| with \^ in AtomicFollower::store$',
    # Channel and transpose occupy different words. The decoded i8 truncates a 256 difference.
    '^tract-effects/src/modulation_telemetry/pitch\.rs:\d+:17: replace \| with \^ in AtomicPitch::store$',
    '^tract-effects/src/modulation_telemetry/pitch\.rs:\d+:56: replace \+ with - in AtomicPitch::store$',
    '^tract-effects/src/modulation_telemetry/pitch\.rs:\d+:53: replace - with \+ in AtomicPitch::load$',
    # Validated mappings, list choices, and host wave values already bound every index.
    '^tract-effects/src/editor/wave_midi\.rs:\d+:91: replace - with (\+|/) in EffectEditor::draw_wave_midi_popup$',
    # Equality already places the focused row first, and at least one row is visible.
    '^tract-effects/src/editor/follower\.rs:\d+:23: replace < with <= in Panel::reveal$',
    # A zero-depth inverse yields no levels. Nonfinite endpoints fail the later guards.
    '^tract-effects/src/editor/pitch_grid\.rs:(54|55):9: replace \|\| with && in mapped_grid$',
    # At zero minimum, max/min is still nonfinite.
    '^tract-effects/src/editor/pitch_grid\.rs:\d+:25: replace > with >= in mapped_grid$',
    # A frequency ratio that overflows f32 would exceed the 512-semitone budget.
    '^tract-effects/src/editor/pitch_grid\.rs:\d+:44: replace / with % in mapped_grid$',
    # Span overflow already exceeds the level budget. NaN log bases yield no levels.
    '^tract-effects/src/editor/pitch_grid\.rs:\d+:31: replace \|\| with && in mapped_grid$',
    # A right press on an open curve menu dismisses it without changing the fresh response.
    "^tract-effects/src/editor/mod\\.rs:957:35: replace \\|= with &= in Session<'a>::on_right_press$",
    # The bundled font's title already fits at the minimum width and at scaled widths.
    '^tract-effects/src/editor/follower/view\.rs:31:25: replace - with \+ in EffectEditor::draw_follower_popup$',
    '^tract-effects/src/editor/follower/view\.rs:31:31: replace - with (\+|/) in EffectEditor::draw_follower_popup$',
    # At the minimum width and at scaled widths, the draft's font-width cap binds before 40% of the row.
    '^tract-effects/src/editor/follower/view\.rs:96:38: replace \* with (\+|/) in EffectEditor::draw_follower_popup$',
    # At valid audio rates, zero Hz adds zero to a phase already below 1.
    '^tract-effects/src/modulation\.rs:\d+:48: replace > with >= in ModulationState::begin_block$',
    # norm < 1 and registered enum sizes make floor(norm*n) <= n-1;
    # loosening the defensive upper cap cannot change the selected index.
    '^tract-effects/src/randomize\.rs:\d+:42: replace - with (\+|/) in randomize_track_effect$',
    # Equal peaks preserve the gate detector exactly with the delta update.
    '^tract-effects/src/effects/gate\.rs:\d+:17: replace > with >= in <impl Effect for GateEffect>::process_sample$',
    # At gain 0 or 1, either smoothing coefficient preserves the same endpoint.
    '^tract-effects/src/effects/gate\.rs:\d+:31: replace > with >= in <impl Effect for GateEffect>::process_sample$',
    # At the lower knee boundary, both branches give unity audio gain.
    '^tract-effects/src/effects/limiter\.rs:\d+:25: replace < with <= in LimiterEffect::gain_computer_db$',
    # Equal peaks only change fast-follower rounding; slow attack/release are equal.
    '^tract-effects/src/effects/transient_shaper\.rs:\d+:29: replace > with >= in TransientShaperEffect::follower_step$',
    # The fallback applies the same hard clip as the explicit Hard arm.
    '^tract-effects/src/effects/distortion\.rs:\d+:13: delete match arm Self::TYPE_HARD in DistortionEffect::shape$',
    # At the fold boundary, both branches return exactly 1.
    '^tract-effects/src/effects/distortion\.rs:\d+:25: replace < with <= in DistortionEffect::shape$',
    # The setter already bounds stored types to 0..4 before this defensive cap.
    '^tract-effects/src/effects/distortion\.rs:\d+:85: replace - with (\+|/) in <impl Effect for DistortionEffect>::process_sample$',
    # At either threshold, the outer integral subtracts the identical bp() value.
    '^tract-effects/src/effects/wavefolder\.rs:\d+:20: replace > with >= in FolderCell::func_ad1$',
    # The outer region has signum +/-1, so multiplication and division agree.
    '^tract-effects/src/effects/wavefolder\.rs:\d+:33: replace \* with / in FolderCell::func$',
    # At a triangle window's midpoint, both branches return exactly 1.
    '^tract-effects/src/effects/(pitch_shift|varispeed)\.rs:\d+:18: replace < with <= in (PitchShiftEffect|VarispeedEffect)::triangle_window$',
    # The Comb setter already bounds modes to 0..2 before this defensive cap.
    '^tract-effects/src/effects/comb\.rs:\d+:81: replace - with (\+|/) in <impl Effect for CombEffect>::process_sample$',
    # Higher Type selectors still choose HP; higher Poles selectors still use four stages.
    '^tract-effects/src/effects/svf\.rs:\d+:(54|55): replace - with (\+|/) in <impl Effect for SvfEffect>::set_param$',
    # Type selectors above 1 still choose the HP coefficient and processing branches.
    '^tract-effects/src/effects/sallen_key\.rs:\d+:\d+: replace - with (\+|/) in <impl Effect for SallenKeyEffect>::set_param$',
    # Triangle arms agree exactly at 1/4 and 3/4; keep Square's boundary active.
    '^tract-effects/src/effects/auto_pan\.rs:(79:22|81:29): replace < with <= in AutoPanEffect::eval_lfo$',
    '^tract-effects/src/effects/tremolo\.rs:(82:22|84:29): replace < with <= in TremoloEffect::eval_lfo$',
    # Higher Shape selectors still choose Saw in both LFOs.
    '^tract-effects/src/effects/(auto_pan|tremolo)\.rs:\d+:59: replace - with (\+|/) in <impl Effect for (AutoPanEffect|TremoloEffect)>::set_param$',
    # The Ring setter bounds stored shapes to 0..1 before this defensive cap.
    '^tract-effects/src/effects/ring\.rs:\d+:84: replace - with (\+|/) in <impl Effect for RingEffect>::process_sample$',
    # Triangle arms agree exactly at 1/4 and 3/4 of a cycle.
    '^tract-effects/src/effects/flanger\.rs:\d+:(14|21): replace < with <= in FlangerEffect::triangle_lfo$',
    # Triangle arms agree at 1/4 and 3/4; keep Square's half-cycle boundary active.
    '^tract-effects/src/effects/vibrato\.rs:(97:22|99:29): replace < with <= in VibratoEffect::eval_lfo$',
    # Higher Shape selectors still choose the Saw fallback.
    '^tract-effects/src/effects/vibrato\.rs:\d+:59: replace - with (\+|/) in <impl Effect for VibratoEffect>::set_param$',
    # Mode and Topology are stored as 0 or 1, so neither can equal 0.5.
    '^tract-effects/src/effects/fm\.rs:\d+:(22|46|51): replace < with <= in <impl Effect for FmEffect>::process_sample$',
    # Equal target/envelope values make either smoothing coefficient multiply zero.
    '^tract-effects/src/effects/fm\.rs:\d+:42: replace > with >= in <impl Effect for FmEffect>::process_sample$',
    # Equal target/envelope values make either duck coefficient multiply zero.
    '^tract-effects/src/effects/delay\.rs:\d+:34: replace > with >= in <impl Effect for DelayEffect>::process_sample$',
    # Higher Time indices still select Free and leave its dial active.
    '^tract-effects/src/effects/delay\.rs:\d+:56: replace - with (\+|/) in <impl Effect for DelayEffect>::set_param$',
    # Construction/reset pair unprimed with zero length; priming captures at least 16 samples.
    '^tract-effects/src/effects/repeat\.rs:\d+:25: replace \|\| with && in <impl Effect for RepeatEffect>::process_sample$',
    # With zero crossfade, the playhead cannot reach the loop end in this branch.
    '^tract-effects/src/effects/repeat\.rs:\d+:43: replace > with >= in <impl Effect for RepeatEffect>::process_sample$',
    # Smooth already limits the fade to half a bounded loop, so a larger cap is redundant.
    '^tract-effects/src/effects/repeat\.rs:\d+:56: replace / with \* in <impl Effect for RepeatEffect>::process_sample$',
    # Priming always installs a window of at least 16 samples; reset clears both.
    '^tract-effects/src/effects/stretch\.rs:\d+:25: replace \|\| with && in <impl Effect for StretchEffect>::process_sample$',
    # Equal signal/envelope values make either coefficient multiply a zero delta.
    '^tract-effects/src/effects/vocoder\.rs:\d+:23: replace > with >= in VocoderEffect::step_env$',
    # The Carrier setter stores 0..2 before this defensive upper cap.
    '^tract-effects/src/effects/vocoder\.rs:\d+:87: replace - with (\+|/) in VocoderEffect::next_carrier$',
    # Clamped f32 scale differences lie on a 2^-24 grid; 1e-6 is off that grid.
    '^tract-effects/src/effects/spectral_shift\.rs:\d+:44: replace < with <= in <impl SpectralTransform for TransformCtx>::transform$',
    # Active transforms overwrite all used magnitudes; bypass never reads scratch.
    '^tract-effects/src/effects/spectral_spread\.rs:\d+:9: replace SpectralSpreadChannel::reset with \(\)$',
    # Extra backing entries are unused; supported FFTs access at most 2049 values.
    '^tract-effects/src/effects/spectral_smear\.rs:16:39: replace / with \*$',
    # Extra backing entries are unused by the supported FFT sizes.
    '^tract-effects/src/effects/spectral_corrupt\.rs:17:39: replace / with \*$',
    # Zero Amount returns through the deadband before choosing quiet/loud ranks.
    "^tract-effects/src/effects/spectral_corrupt\\.rs:\\d+:33: replace > with >= in <impl SpectralTransform for TransformCtx<'_>>::transform$",
    # Extra mask entries are unused by the supported FFT sizes.
    '^tract-effects/src/effects/spectral_lofi\.rs:14:39: replace / with \*$',
    # A larger backing stride only adds unused entries between supported bins.
    '^tract-effects/src/effects/spectral_scatter\.rs:21:39: replace / with \*$',
    # A larger backing stride only adds unused entries between supported bins.
    '^tract-effects/src/effects/spectral_cascade\.rs:23:39: replace / with \*$',
    # Extra tail entries are unused by the supported FFT sizes.
    '^tract-effects/src/effects/spectral_reverb\.rs:13:39: replace / with \*$',
    # Stored sample rate is unused; FFT and dry delay run at fixed sample counts.
    '^tract-effects/src/effects/satch\.rs:\d+:9: replace <impl Effect for SatchEffect>::set_sample_rate with \(\)$',
    # The shifter bounds bins again, so expanding this outer cap leaves audio unchanged.
    '^tract-effects/src/effects/warp_zone\.rs:\d+:44: replace / with \* in WarpZoneEffect::frequency_bins$',
]
