[package]
name = "tiny-skia-widgets"
version = "0.1.0"
edition.workspace = true

[dependencies]
tiny-skia = "0.12"
fontdue = "0.9"
# Editor base (softbuffer + nih-plug integration)
nih_plug.workspace = true
baseview = { git = "https://github.com/RustAudio/baseview.git", tag = "v0.1.1", features = ["opengl"] }
softbuffer = { version = "0.4", default-features = false, features = ["kms", "x11"] }
raw-window-handle = "0.5"
raw-window-handle-06 = { package = "raw-window-handle", version = "0.6" }
crossbeam = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
keyboard-types = "0.6"
rfd = "0.17.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
