[workspace]
members = ["wavetable-filter", "gs-meter", "gain-brain", "tinylimit", "satch", "pope-scope", "warp-zone", "six-pack", "imagine", "miff", "multosis", "minitosis", "nap", "hd26", "gated", "lincoln", "tiny-skia-widgets", "tract-dsp", "tract-effects", "xtask", "bench-suite"]
# `nih-plug-widgets` is the legacy vizia widget crate — unreferenced since
# wavetable-filter's tiny-skia port. Excluded so its old transitive deps
# (xcb 0.9.0 in particular, which trips a future-incompat lint) don't enter
# the workspace lock file. The source is kept on disk for reference only.
exclude = ["nih-plug", "nih-plug-widgets"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
fearless_simd = "1.0"
nih_plug = { git = "https://github.com/xxx/nih-plug.git", rev = "6d31da0207a4ab537779f29db69fee66c5519ffc" }
nih_plug_xtask = { git = "https://github.com/xxx/nih-plug.git", rev = "6d31da0207a4ab537779f29db69fee66c5519ffc" }

[profile.release]
lto = true
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.mutants]
inherits = "test"
debug = 0
