name: Release Plugins

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }} (${{ matrix.mode }})
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        mode: [redistributable, native]
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-15
            platform: macos-universal
            mode: redistributable
          - os: macos-15
            platform: macos-arm64
            mode: native
          - os: macos-15-intel
            platform: macos-x86_64
            mode: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libx11-xcb-dev libx11-dev libxcursor-dev libasound2-dev libgl-dev libjack-jackd2-dev libwayland-dev

      - name: Install Rust stable
        run: rustup update stable

      - name: Build universal macOS plugins
        if: matrix.platform == 'macos-universal'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo --locked xtask bundle-universal --redistributable --locked

      - name: Build plugins
        if: matrix.platform != 'macos-universal'
        run: cargo --locked xtask bundle --${{ matrix.mode }} --locked

      - name: Package CLAP and VST3
        shell: bash
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          PACKAGE: ${{ matrix.platform }}-${{ matrix.mode }}${{ runner.os == 'macOS' && '-unnotarized' || '' }}
        run: |
          python_command=python3
          license_targets=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            python_command=python
          fi
          if [[ "$PACKAGE" == macos-universal-* ]]; then
            license_targets=(--target x86_64-apple-darwin --target aarch64-apple-darwin)
          fi
          "$python_command" .github/scripts/package-release.py \
            "tract-plugin-pack-$VERSION-$PACKAGE" release "${license_targets[@]}"

      - name: Upload ZIPs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins-${{ matrix.platform }}-${{ matrix.mode }}
          path: release/*.zip
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  draft:
    name: Stage GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download ZIPs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plugins-*
          path: release
          merge-multiple: true

      - name: Create draft with all ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          archives=(release/*.zip)
          if [[ "${#archives[@]}" -ne 14 ]]; then
            echo "Expected 14 release ZIPs, found ${#archives[@]}." >&2
            exit 1
          fi

          tag_commit=$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits" \
            -f "sha=refs/tags/$RELEASE_TAG" -F per_page=1 --jq '.[0].sha')
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag $RELEASE_TAG no longer points to the built commit." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists." >&2
            exit 1
          fi

          printf 'Built from commit %s.\n\n' "$GITHUB_SHA" > release-notes.md
          printf 'macOS ZIPs are unnotarized. [Installation and approval instructions](%s/%s/blob/%s/docs/installing-macos.md)\n\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> release-notes.md
          gh release create "$RELEASE_TAG" "${archives[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes \
            --notes-file release-notes.md
