name: Mutation testing

on:
  pull_request:
    paths:
      - "tract-dsp/**"
      - "tract-effects/**"
      - ".cargo/mutants*.toml"
      - ".config/nextest.toml"
      - ".github/workflows/mutation-testing.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  plan:
    name: Plan mutation shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Count mutants and plan shards
        id: shards
        run: |
          scope=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            comparison_base=$(git merge-base "$MUTATION_BASE_SHA" HEAD)
            git diff --no-ext-diff --no-textconv --no-color --unified=0 "$comparison_base" HEAD -- > "$RUNNER_TEMP/pr.diff"
            scope=(--in-diff "$RUNNER_TEMP/pr.diff")
          fi
          for package in tract-dsp tract-effects; do
            config=.cargo/mutants.toml
            max_shards=3
            if [[ "$package" == tract-effects ]]; then
              config=.cargo/mutants-tract-effects.toml
              max_shards=16
            fi
            cargo mutants -p "$package" --config "$config" "${scope[@]}" --list --json > "$RUNNER_TEMP/$package-mutants.json"
            count=$(jq -s '.[0] // [] | length' "$RUNNER_TEMP/$package-mutants.json")
            # Allow at most 19 mutation jobs plus this planning job.
            shards=$(( (count + 63) / 64 ))
            shards=$(( shards < 1 ? 1 : (shards > max_shards ? max_shards : shards) ))
            echo "$package selected $count mutants across $shards shard(s)" >&2
            jq -cn --arg package "$package" --arg config "$config" --argjson count "$shards" \
              'range(0; $count) | {package: $package, config: $config, shard: "\(.)/\($count)", part: (. + 1), total: $count}'
          done > "$RUNNER_TEMP/mutation-plan.jsonl"
          matrix=$(jq -cs '{include: .}' "$RUNNER_TEMP/mutation-plan.jsonl")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mutation-testing:
    name: ${{ matrix.total == 1 && matrix.package || format('{0} ({1}/{2})', matrix.package, matrix.part, matrix.total) }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      MUTATION_PACKAGE: ${{ matrix.package }}
      MUTATION_CONFIG: ${{ matrix.config }}
      MUTATION_REPORT_DIR: mutation-reports/${{ matrix.package }}
      MUTATION_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        if: matrix.package == 'tract-effects'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libx11-xcb-dev libx11-dev libxcursor-dev libasound2-dev libgl-dev libjack-jackd2-dev libwayland-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install mutation test tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mutants-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}

      - name: Prepare mutation report directory
        run: mkdir -p "$MUTATION_REPORT_DIR"

      - name: Prepare PR diff
        if: github.event_name == 'pull_request'
        run: |
          comparison_base=$(git merge-base "$MUTATION_BASE_SHA" HEAD)
          git diff --no-ext-diff --no-textconv --no-color --unified=0 "$comparison_base" HEAD -- > "$MUTATION_REPORT_DIR/pr.diff"

      - name: Test mutation shard
        env:
          CARGO_INCREMENTAL: 1
        run: |
          scope=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            scope=(--in-diff "$MUTATION_REPORT_DIR/pr.diff")
          fi
          cargo mutants -p "$MUTATION_PACKAGE" --config "$MUTATION_CONFIG" --in-place \
            "${scope[@]}" --shard "$MUTATION_SHARD" --sharding round-robin \
            --caught --unviable --output "$MUTATION_REPORT_DIR" -- --test-threads 2

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.total == 1 && format('{0}-mutants', matrix.package) || format('{0}-mutants-{1}', matrix.package, matrix.part) }}
          path: ${{ env.MUTATION_REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 14
