name: Mutation testing

on:
  pull_request:
    paths:
      - "tract-dsp/**"
      - "tract-effects/**"
      - ".cargo/mutants*.toml"
      - ".config/nextest.toml"
      - ".github/workflows/mutation-testing.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutation-testing:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: tract-dsp
            config: .cargo/mutants.toml
          - package: tract-effects
            config: .cargo/mutants-tract-effects.toml
    env:
      MUTATION_PACKAGE: ${{ matrix.package }}
      MUTATION_CONFIG: ${{ matrix.config }}
      MUTATION_REPORT_DIR: mutation-reports/${{ matrix.package }}
      MUTATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        if: matrix.package == 'tract-effects'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libx11-xcb-dev libx11-dev libxcursor-dev libasound2-dev libgl-dev libjack-jackd2-dev libwayland-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install mutation test tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: mutants-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}

      - name: Prepare mutation report directory
        run: mkdir -p "$MUTATION_REPORT_DIR"

      - name: Prepare PR diff
        if: github.event_name == 'pull_request'
        run: |
          comparison_base=$(git merge-base "$MUTATION_BASE_SHA" HEAD)
          git diff --no-ext-diff --no-textconv --no-color --unified=0 "$comparison_base" HEAD -- > "$MUTATION_REPORT_DIR/pr.diff"

      - name: Mutate changed code
        if: github.event_name == 'pull_request'
        run: cargo mutants -p "$MUTATION_PACKAGE" --config "$MUTATION_CONFIG" --in-place --in-diff "$MUTATION_REPORT_DIR/pr.diff" --output "$MUTATION_REPORT_DIR"

      - name: Mutate full registered scope
        if: github.event_name == 'workflow_dispatch'
        run: cargo mutants -p "$MUTATION_PACKAGE" --config "$MUTATION_CONFIG" --in-place --output "$MUTATION_REPORT_DIR"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-mutants
          path: ${{ env.MUTATION_REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 14
